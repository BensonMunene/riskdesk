{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card login-card">
  <div class="card-body p-4">
    <div class="text-center mb-3">
      <i class="bi bi-shield-check text-primary" style="font-size:2rem"></i>
      <h1 class="h5 mt-2 mb-0">RiskDesk</h1>
      <div class="muted small">Portfolio risk &amp; construction workbench</div>
    </div>
    {% if form.errors %}<div class="alert alert-danger py-2 small">Invalid username or password.</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-2"><label class="form-label">Username</label><input class="form-control" name="username" autofocus value="{{ form.username.value|default:'' }}"></div>
      <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password"></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
    <div class="muted small mt-3 text-center">Demo login: <code>cio</code> / <code>riskdesk</code></div>
  </div>
</div>
{% endblock %}
